limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# $connection_upgrade is defined once in a shared include (conf.d/common.conf)
# on the deploy host, so the map is commented out here to avoid a duplicate
# "map" directive. If you deploy to a host WITHOUT that shared map, uncomment
# this block — nginx needs $connection_upgrade defined for the /ws location.
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     '' close;
# }

upstream backend {
    server localhost:8080;
}

server {
    listen       80;
    server_name snapfile.yanxurui.cc;
    return 301 https://$host$request_uri;
}

server {
    # Compatible with older CentOS nginx. On nginx >= 1.25.1, prefer plain
    # "listen ... ssl" plus "http2 on;" (see README).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name snapfile.yanxurui.cc;

    access_log /var/www/snapfile/logs/nginx_access.log;
    error_log /var/www/snapfile/logs/nginx_err.log;

    client_max_body_size 1024m;
    client_body_buffer_size 1m;
    limit_req zone=mylimit burst=5 nodelay;

    root /var/www/snapfile/static;

    # serve static files
    # internal redirect from / to /index.html
    location / {
    }

    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        gzip on;
        gzip_types application/javascript text/css;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /login.html {
        add_header Cache-Control "no-cache";
    }

    # restricted to only logged users
    location = /index.html {
        add_header Cache-Control "no-cache";
        auth_request /auth;
        # tell client to redirect on 401
        # it's also possible to construct the redirect URL manually
        error_page 401 = @login_required;
    }
    location @login_required {
        return 302 /login.html;
    }

    # APIs handled by python backend
    location ~ ^/(signup|login|logout|auth|files(?:/[A-Za-z0-9_-]+)?)$ {
        proxy_pass http://backend;

        # do not save to the temp file when uploading
        proxy_request_buffering off;

        # support chunked transfer encoding
        # otherwise the request body will be buffered
        proxy_http_version 1.1;

        # do not buffer when downloading files from upstream
        proxy_buffering off;
    }

    # Only the authenticated backend can dispatch committed ciphertext here.
    location ^~ /download/ {
        internal;
        alias /var/www/snapfile/files/;
        sendfile on;
        if ($uri !~ "^/download/[1-9][0-9]*/[0-9a-f]{64}/[0-9]+$") {
            return 404;
        }
        types { }
        default_type application/octet-stream;
    }

    # websocket proxy
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

}
